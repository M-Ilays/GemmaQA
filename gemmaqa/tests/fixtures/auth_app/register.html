<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sign Up — Auth Fixture</title>
</head>
<body>
  <h1>Sign Up</h1>
  <p id="msg"></p>
  <form id="registration_form">
    <label>First Name <input id="firstName" name="firstName" type="text" required /></label>
    <label>Last Name <input id="lastName" name="lastName" type="text" required /></label>
    <label>Email <input id="email" name="email" type="email" required /></label>
    <label>Password <input id="password" name="password" type="password" required /></label>
    <button type="submit" id="register_submit">Submit</button>
  </form>
  <a href="login.html">Cancel</a>
  <script>
    document.getElementById("registration_form").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const users = JSON.parse(localStorage.getItem("gemmaqa_users") || "{}");
      users[email] = password;
      localStorage.setItem("gemmaqa_users", JSON.stringify(users));
      localStorage.setItem("gemmaqa_session", email);
      location.href = "dashboard.html";
    });
  </script>
</body>
</html>
