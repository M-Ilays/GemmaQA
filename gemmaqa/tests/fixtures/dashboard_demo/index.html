<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>InsightBoard</title>
<style>
  body { font-family: sans-serif; margin: 0; color: #1a1a1a; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #1f2937; color: white; }
  header nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: 600; }
  .icon-btn { background: none; border: none; color: white; cursor: pointer; font-size: 18px; margin-left: 12px; }
  main { padding: 24px; }
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid #e5e7eb; margin-bottom: 16px; }
  .tabs button { padding: 10px 16px; border: none; background: none; cursor: pointer; font-size: 15px; }
  .tabs button[aria-selected="true"] { border-bottom: 3px solid #2563eb; font-weight: 700; }
  .panel { display: none; }
  .panel.active { display: block; }
  .cards { display: flex; gap: 16px; margin-bottom: 24px; }
  .card { flex: 1; padding: 20px; border-radius: 8px; background: #f3f4f6; cursor: pointer; min-width: 160px; min-height: 90px; }
  .card h3 { margin: 0 0 8px 0; font-size: 14px; color: #555; }
  .card .value { font-size: 28px; font-weight: 700; }
  canvas { border: 1px solid #e5e7eb; border-radius: 8px; }
</style>
</head>
<body>
<header>
  <nav aria-label="Main">
    <a href="/index.html">Dashboard</a>
    <a href="/reports.html">Reports</a>
    <a href="/team.html">Team</a>
  </nav>
  <div>
    <button class="icon-btn" id="notif-btn" onclick="alert('notifications')"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2a6 6 0 00-6 6v3.5L4 15h16l-2-3.5V8a6 6 0 00-6-6zm0 20a2.5 2.5 0 002.45-2h-4.9A2.5 2.5 0 0012 22z"/></svg></button>
    <button class="icon-btn" id="settings-btn" onclick="alert('settings')"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="12" r="3"/><path d="M2 12h4m12 0h4M12 2v4m0 12v4"/></svg></button>
  </div>
</header>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-overview" aria-selected="true" onclick="showTab('overview')">Overview</button>
    <button role="tab" id="tab-performance" aria-selected="false" onclick="showTab('performance')">Performance</button>
    <button role="tab" id="tab-activity" aria-selected="false" onclick="showTab('activity')">Activity</button>
  </div>

  <div class="panel active" id="panel-overview">
    <div class="cards">
      <div class="card" onclick="location.href='/reports.html'">
        <h3>Active Customers</h3>
        <div class="value">128</div>
      </div>
      <div class="card" onclick="location.href='/reports.html'">
        <h3>Open Jobs</h3>
        <div class="value">12</div>
      </div>
      <div class="card" onclick="location.href='/team.html'">
        <h3>Team Members</h3>
        <div class="value">9</div>
      </div>
    </div>
    <canvas id="chart" width="420" height="180" aria-label="Monthly revenue chart"></canvas>
    <p>
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7"
           alt="Quarterly revenue trend showing steady growth across all regions" width="300" height="120" />
    </p>
  </div>

  <div class="panel" id="panel-performance">
    <p>Performance metrics go here.</p>
  </div>

  <div class="panel" id="panel-activity">
    <p>Recent activity feed goes here.</p>
  </div>
</main>
<script>
  function showTab(name) {
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', 'false'));
    document.getElementById('tab-' + name).setAttribute('aria-selected', 'true');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
  }
  const ctx = document.getElementById('chart').getContext('2d');
  ctx.fillStyle = '#2563eb';
  const values = [40, 90, 60, 120, 80, 150];
  values.forEach((v, i) => ctx.fillRect(20 + i * 60, 180 - v, 40, v));
</script>
</body>
</html>
