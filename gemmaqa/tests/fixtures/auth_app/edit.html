<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Edit Contact — Auth Fixture</title>
</head>
<body>
  <h1>Edit Contact</h1>
  <form id="edit_form">
    <label>Name <input id="name" name="name" type="text" required /></label>
    <label>Email <input id="email" name="email" type="email" required /></label>
    <button type="submit" id="save">Save</button>
  </form>
  <a href="dashboard.html">Cancel</a>
  <script>
    if (!localStorage.getItem("gemmaqa_session")) location.href = "login.html?expired=1";
    const id = Number(new URLSearchParams(location.search).get("id") || 0);
    const contacts = JSON.parse(localStorage.getItem("gemmaqa_contacts") || "[]");
    const c = contacts[id] || { name: "", email: "" };
    document.getElementById("name").value = c.name;
    document.getElementById("email").value = c.email;
    document.getElementById("edit_form").addEventListener("submit", (e) => {
      e.preventDefault();
      contacts[id] = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
      };
      localStorage.setItem("gemmaqa_contacts", JSON.stringify(contacts));
      location.href = "detail.html?id=" + id;
    });
  </script>
</body>
</html>
