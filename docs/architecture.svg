<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-label="GemmaQA architecture diagram">
  <rect width="1100" height="720" fill="#0b1220"/>
  <text x="550" y="42" text-anchor="middle" fill="#e8eefc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">GemmaQA Architecture</text>
  <text x="550" y="68" text-anchor="middle" fill="#9db0d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">AWS Strands Agents SDK coordinator | AgentController executor | Playwright browser</text>

  <rect x="80" y="100" width="940" height="90" rx="14" fill="#152238" stroke="#3b82f6" stroke-width="2"/>
  <text x="550" y="138" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">USER / OPERATOR</text>
  <text x="550" y="164" text-anchor="middle" fill="#e8eefc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">React UI  |  New Run, live activity log, Pause / Resume / End</text>

  <path d="M550 190 L550 230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="218" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">HTTP / WebSocket</text>

  <rect x="80" y="230" width="940" height="320" rx="16" fill="#101a2c" stroke="#334155" stroke-width="2"/>
  <text x="110" y="258" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">FASTAPI BACKEND</text>

  <rect x="110" y="278" width="420" height="240" rx="12" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="320" y="312" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">STRANDS COORDINATOR</text>
  <text x="320" y="336" text-anchor="middle" fill="#e8eefc" font-family="Segoe UI, Arial, sans-serif" font-size="13">AWS Strands Agents SDK</text>
  <text x="320" y="358" text-anchor="middle" fill="#e8eefc" font-family="Segoe UI, Arial, sans-serif" font-size="13">Amazon Bedrock (Nova)</text>
  <text x="320" y="392" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Plans the QA run</text>
  <text x="320" y="412" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Calls tools: launch, inspect,</text>
  <text x="320" y="432" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">pause, resume, read log, end</text>
  <text x="320" y="462" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12">Does not drive the browser</text>
  <text x="320" y="492" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="11">Optional: AgentCore Runtime</text>

  <path d="M530 398 L570 398" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="386" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="11">tools</text>

  <rect x="570" y="278" width="420" height="240" rx="12" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
  <text x="780" y="312" text-anchor="middle" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">AGENT CONTROLLER</text>
  <text x="780" y="336" text-anchor="middle" fill="#e8eefc" font-family="Segoe UI, Arial, sans-serif" font-size="13">Observe - Classify - Plan</text>
  <text x="780" y="358" text-anchor="middle" fill="#e8eefc" font-family="Segoe UI, Arial, sans-serif" font-size="13">Execute - Report</text>
  <text x="780" y="392" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Optional page model:</text>
  <text x="780" y="412" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Bedrock | Gemini | Ollama | Mock</text>
  <text x="780" y="442" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Safety policy, evidence, reports</text>
  <text x="780" y="492" text-anchor="middle" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="12">Drives the real browser</text>

  <path d="M780 550 L780 590" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="590" width="440" height="90" rx="14" fill="#152238" stroke="#a78bfa" stroke-width="2"/>
  <text x="300" y="628" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">PLAYWRIGHT | Chromium</text>
  <text x="300" y="654" text-anchor="middle" fill="#e8eefc" font-family="Segoe UI, Arial, sans-serif" font-size="13">Click, type, navigate, screenshot</text>

  <rect x="580" y="590" width="440" height="90" rx="14" fill="#152238" stroke="#f59e0b" stroke-width="2"/>
  <text x="800" y="628" text-anchor="middle" fill="#fcd34d" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">AUTHORIZED TARGET SITE</text>
  <text x="800" y="654" text-anchor="middle" fill="#e8eefc" font-family="Segoe UI, Arial, sans-serif" font-size="13">Only systems you own or may test</text>

  <path d="M520 635 L580 635" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
